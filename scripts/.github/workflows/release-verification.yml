name: Verify v11.4.30 app release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-v11-4-26-main
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Python and JavaScript syntax
        run: |
          python -m py_compile scripts/*.py
          for file in assets/*.js edge/*.js; do node --check "$file"; done
      - name: Strict data validation
        run: python scripts/validate_public_data.py all
      - name: Automated tests
        run: python -m pytest -q
      - name: HTTP app-shell integration
        run: |
          python -m http.server 8765 > /tmp/market-radar-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 0.25; done
          python scripts/http_smoke.py http://127.0.0.1:8765
