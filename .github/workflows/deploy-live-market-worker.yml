name: Deploy v11.4.31 live market worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "edge/**"
      - ".github/workflows/deploy-live-market-worker.yml"
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_KV_NAMESPACE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Wrangler configuration
        working-directory: edge
        env:
          KV_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: sed "s/REPLACE_WITH_KV_NAMESPACE_ID/$KV_ID/" wrangler.toml.example > wrangler.toml
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edge
          command: deploy
