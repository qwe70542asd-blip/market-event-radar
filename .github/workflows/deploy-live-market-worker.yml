name: Deploy v11.4.35 live market worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "edge/**"
      - ".github/workflows/deploy-live-market-worker.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_KV_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
    steps:
      - name: Cloudflare not configured
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' || env.CF_KV_ID == ''
        run: echo "Cloudflare secrets are not configured; skipping optional edge-worker deployment. GitHub Actions fallback remains active."
      - uses: actions/checkout@v4
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.CF_KV_ID != ''
      - name: Build Wrangler configuration
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.CF_KV_ID != ''
        working-directory: edge
        env:
          KV_ID: ${{ env.CF_KV_ID }}
        run: sed "s/REPLACE_WITH_KV_NAMESPACE_ID/$KV_ID/" wrangler.toml.example > wrangler.toml
      - uses: cloudflare/wrangler-action@v3
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.CF_KV_ID != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edge
          command: deploy
