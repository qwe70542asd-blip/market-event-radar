name: Update v11.4.9 official market notices
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-official-notices.yml"
      - "scripts/update_official_notices.py"
      - "scripts/news_pipeline.py"
  schedule:
    - cron: "2-59/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-official-notices
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore isolated official archive and asset aliases
        run: |
          bash scripts/restore_data_branch.sh live-official-notices \
            "official-market-notices.json:data/official-market-notices.json" \
            "official-market-notices-seed.js:data/official-market-notices-seed.js"
          bash scripts/restore_data_branch.sh live-assets \
            "assets.json:data/assets.json"
      - run: python scripts/update_official_notices.py
      - name: Validate isolated official channel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/official-market-notices.json").read_text(encoding="utf-8"))
          assert p.get("items"), "official notices returned no usable records"
          print("official notices",len(p["items"]))
          PY
      - name: Publish isolated channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-official-notices official-notices data/official-market-notices.json data/official-market-notices-seed.js
