name: Update v11.4.43 data verification
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-data-verification.yml"
      - "scripts/update_data_verification.py"
      - "scripts/restore_data_branch.sh"
      - "scripts/wait_for_data_channels.py"
      - "scripts/publish_data_branch.sh"
  schedule:
    - cron: "58 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data-verification
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Wait for v11.4.43 isolated-data release barrier
        if: github.event_name == 'push'
        run: python scripts/wait_for_data_channels.py v11.4.43 --attempts 222 --sleep 10
      - name: Restore source channels
        run: |
          bash scripts/restore_data_branch.sh live-assets "assets.json:data/assets.json" "asset-audit.json:data/asset-audit.json"
          bash scripts/restore_data_branch.sh live-tw-market "tw-market.json:data/tw-market.json"
          bash scripts/restore_data_branch.sh live-monthly-revenue "monthly-revenue.json:data/monthly-revenue.json"
          bash scripts/restore_data_branch.sh live-dividend-history "dividend-history.json:data/dividend-history.json"
          bash scripts/restore_data_branch.sh live-secondary-reference "secondary-reference.json:data/secondary-reference.json"
          bash scripts/restore_data_branch.sh live-yahoo-details "yahoo-details.json:data/yahoo-details.json"
          bash scripts/restore_data_branch.sh live-etf-details "etf-details.json:data/etf-details.json"
      - run: python scripts/update_data_verification.py
      - name: Publish verification channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-data-verification live-data-verification data/data-verification.json data/data-verification-seed.js
