name: Update market events

on:
  schedule:
    # 00:15 UTC = 08:15 Asia/Taipei
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update events
        env:
          NASDAQ_ENABLED: "1"
        run: python scripts/update_events.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/events.json data/seed.js; then
            echo "No event changes."
            exit 0
          fi
          git config user.name "market-event-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/seed.js
          git commit -m "chore: update market events"
          git push
