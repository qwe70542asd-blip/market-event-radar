name: Update v11.2.2 event calendar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-events.yml"
      - "scripts/update_events.py"
      - "scripts/publish_data_branch.sh"
      - "scripts/restore_data_branch.sh"
      - "data/manual-events.json"
      - "requirements.txt"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      clean_rebuild:
        description: "Ignore live-events and rebuild from the verified legacy bootstrap plus manual events"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: market-radar-events
  cancel-in-progress: true

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_BRANCH: live-events
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore previous verified event archive
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.clean_rebuild) }}
        run: |
          bash scripts/restore_data_branch.sh "$DATA_BRANCH"             "events.json:data/events.json"             "events-seed.js:data/events-seed.js"
      - name: Bootstrap verified events when the new channel is empty
        shell: bash
        run: |
          set -euo pipefail
          EVENT_COUNT="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload=json.loads(Path("data/events.json").read_text(encoding="utf-8"))
              print(len(payload.get("events") or []))
          except Exception:
              print(0)
          PY
          )"
          if [ "$EVENT_COUNT" -eq 0 ]; then
            echo "Migrating the last verified event archive from legacy live-data."
            bash scripts/restore_data_branch.sh "live-data"               "events.json:data/events.json"               "events-seed.js:data/events-seed.js"
          fi
      - run: python scripts/update_events.py
      - name: Validate events
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("data/events.json").read_text(encoding="utf-8"))
          events=payload.get("events") or []
          assert events, "empty event calendar after legacy bootstrap"
          print("events",len(events))
          print("updated",payload.get("metadata",{}).get("updated_at"))
          PY
      - name: Publish isolated event channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish_data_branch.sh "$DATA_BRANCH" "event-calendar"             data/events.json data/events-seed.js
