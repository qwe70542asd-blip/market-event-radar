name: Update v11.4.44 event calendar and announced dates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-events.yml"
      - "scripts/update_events.py"
      - "scripts/publish_data_branch.sh"
      - "scripts/restore_data_branch.sh"
      - "data/manual-events.json"
      - "data/event-source-state.json"
      - "requirements.txt"
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
    inputs:
      clean_rebuild:
        description: "Ignore live-events and rebuild the verified archive and comparison baseline"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: market-radar-events
  cancel-in-progress: true

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      DATA_BRANCH: live-events
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore previous verified event archive and comparison state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.clean_rebuild) }}
        run: |
          bash scripts/restore_data_branch.sh "$DATA_BRANCH" \
            "events.json:data/events.json" \
            "events-seed.js:data/events-seed.js" \
            "event-source-state.json:data/event-source-state.json"

      - name: Bootstrap verified events when the isolated channel is empty
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.clean_rebuild) }}
        shell: bash
        run: |
          set -euo pipefail
          EVENT_COUNT="$(python - <<'PY'
          import json
          import re
          from pathlib import Path
          try:
              payload=json.loads(Path("data/events.json").read_text(encoding="utf-8"))
              print(len(payload.get("events") or []))
          except Exception:
              print(0)
          PY
          )"
          if [ "$EVENT_COUNT" -eq 0 ]; then
            echo "Migrating the last verified event archive from legacy live-data."
            bash scripts/restore_data_branch.sh "live-data" \
              "events.json:data/events.json" \
              "events-seed.js:data/events-seed.js"
          fi

      - name: Scan official calendars and compare exact dates
        run: python scripts/update_events.py

      - name: Validate event archive and date-monitor metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("data/events.json").read_text(encoding="utf-8"))
          state=json.loads(Path("data/event-source-state.json").read_text(encoding="utf-8"))
          events=payload.get("events") or []
          metadata=payload.get("metadata") or {}
          assert events, "empty event calendar after official-source refresh"
          assert metadata.get("version")=="v11.4.44", metadata
          assert metadata.get("state_initialized") is True, metadata
          assert metadata.get("archive_start")=="2026-01-01", metadata
          assert isinstance(metadata.get("announced_today_count"), int), metadata
          assert all(str(row.get("local_date") or row.get("start") or "")[:10] >= "2026-01-01" for row in events)
          assert state.get("initialized") is True, state
          assert int(state.get("tracking_key_version") or 0) >= 2, state
          assert metadata.get("announcement_integrity") == "strict-v11.4.44-series-safe", metadata
          assert all(row.get("id") and row.get("title") and row.get("start") for row in events)
          for row in events:
              if row.get("origin") in {"bea","bls"} and row.get("announcement_kind") in {"new-date","date-changed"}:
                  key=str(row.get("tracking_key", ""))
                  if row.get("origin") == "bea":
                      assert re.match(r"^bea\|[^|]+\|20\d{2}\|[^|]+$", key), row
                  else:
                      assert re.match(r"^bls\|[^|]+\|[^|]+$", key), row
          print("events",len(events))
          print("today newly announced",metadata.get("announced_today_count"))
          print("sources ok",metadata.get("source_ok_count"))
          print("sources warning",metadata.get("source_warning_count"))
          PY

      - run: python scripts/validate_public_data.py events
      - name: Publish isolated event channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish_data_branch.sh "$DATA_BRANCH" "event-calendar-v11.4.44" \
            data/events.json \
            data/events-seed.js \
            data/event-source-state.json
