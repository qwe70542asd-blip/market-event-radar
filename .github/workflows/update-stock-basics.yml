name: Update v11.4.37 stock basics
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-stock-basics.yml"
      - "scripts/update_stock_basics.py"
      - "scripts/common.py"
      - "requirements.txt"
  schedule:
    - cron: "15 1,7,13,19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-stock-basics
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore official asset master
        run: bash scripts/restore_data_branch.sh live-assets "assets.json:data/assets.json"
      - name: Restore previous stock basics
        run: |
          bash scripts/restore_data_branch.sh live-stock-basics \
            "stock-basics.json:data/stock-basics.json" \
            "stock-basics-seed.js:data/stock-basics-seed.js"
      - run: python scripts/update_stock_basics.py
      - run: python scripts/validate_public_data.py basics
      - name: Publish stock basics channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-stock-basics live-stock-basics data/stock-basics.json data/stock-basics-seed.js
