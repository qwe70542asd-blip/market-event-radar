name: Update Taiwan chips
on:
  push:
    branches: [main]
    paths:
      - "VERSION.json"
      - ".github/workflows/update-tw-chips.yml"
      - "scripts/update_tw_chips.py"
      - "scripts/common.py"
      - "requirements.txt"
  schedule:
    - cron: "20 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-tw-chips
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore live asset master, verified market date and previous chips
        run: |
          bash scripts/restore_data_branch.sh live-assets "assets.json:data/assets.json"
          bash scripts/restore_data_branch.sh live-tw-market "tw-market.json:data/tw-market.json"
          bash scripts/restore_data_branch.sh live-tw-chips "tw-chips.json:data/tw-chips.json" "tw-chips-seed.js:data/tw-chips-seed.js"
      - run: python scripts/update_tw_chips.py
      - name: Validate chips payload
        run: |
          python - <<'PYCODE'
          import json
          from datetime import date
          from pathlib import Path
          path = Path("data/tw-chips.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert isinstance(payload, dict) and isinstance(payload.get("items"), dict)
          meta=payload.get("metadata",{})
          assert meta.get("version")=="v11.4.58", meta
          assert meta.get("schema")=="symbol-keyed-v2", meta
          for key,row in payload.get("items",{}).items():
              assert ":" not in key and key == str(row.get("symbol") or "").upper(), (key,row.get("symbol"))
              if row.get("date"): assert date.fromisoformat(row["date"]).weekday() < 5, row["date"]
              for source in row.get("sources") or []:
                  if source.get("date"): assert date.fromisoformat(source["date"]).weekday() < 5, (key,source)
              for snapshot in row.get("history") or []:
                  if snapshot.get("date"): assert date.fromisoformat(snapshot["date"]).weekday() < 5, (key,snapshot.get("date"))
          assert all(date.fromisoformat(day).weekday() < 5 for day in payload.get("available_dates",[]))
          assert path.stat().st_size > 20
          print(meta)
          PYCODE
      - name: Publish data channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-tw-chips live-tw-chips data/tw-chips.json data/tw-chips-seed.js
