name: Update v11.4.9 Taiwan chips
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "data/**"
  schedule:
    - cron: "20 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-tw-chips
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore previous chips
        run: bash scripts/restore_data_branch.sh live-tw-chips "tw-chips.json:data/tw-chips.json" "tw-chips-seed.js:data/tw-chips-seed.js"
      - run: python scripts/update_tw_chips.py
      - name: Publish data channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-tw-chips live-tw-chips data/tw-chips.json data/tw-chips-seed.js
