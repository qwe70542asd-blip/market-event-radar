name: Update v11.4.45 assets and audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-daily.yml"
      - "scripts/update_assets.py"
      - "scripts/audit_all_assets.py"
      - "scripts/common.py"
      - "requirements.txt"
  schedule:
    - cron: "30 0,12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-assets
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore detailed asset history
        run: |
          bash scripts/restore_data_branch.sh live-assets \
            "assets.json:data/assets.json" \
            "assets-seed.js:data/assets-seed.js" \
            "asset-history-state.json:data/asset-history-state.json"
      - run: python scripts/update_assets.py
      - name: Restore enrichment channels for final audit
        run: |
          bash scripts/restore_data_branch.sh live-yahoo-details "yahoo-details.json:data/yahoo-details.json"
          bash scripts/restore_data_branch.sh live-etf-details "etf-details.json:data/etf-details.json"
          bash scripts/restore_data_branch.sh live-dividend-history "dividend-history.json:data/dividend-history.json"
      - run: python scripts/audit_all_assets.py
      - name: Publish data channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-assets live-assets data/assets.json data/assets-seed.js data/asset-audit.json data/asset-audit-seed.js data/asset-coverage.json data/asset-audit-failures.csv data/asset-update-status.json data/asset-history-state.json
