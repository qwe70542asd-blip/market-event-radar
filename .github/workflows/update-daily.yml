name: Update v11.2.3 assets and financials

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-daily.yml"
      - "scripts/update_assets.py"
      - "scripts/publish_data_branch.sh"
      - "scripts/restore_data_branch.sh"
      - "requirements.txt"
  schedule:
    - cron: "20 22 * * *"
    - cron: "40 10 * * 1-5"
  workflow_dispatch:
    inputs:
      clean_rebuild:
        description: "Ignore the previous live-assets payload and rebuild from main"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: market-radar-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      DATA_BRANCH: live-assets
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify financial parser dependencies
        run: |
          python - <<'PY'
          import pandas, lxml, html5lib
          print("pandas", pandas.__version__)
          print("lxml", lxml.__version__)
          print("html5lib", html5lib.__version__)
          PY
      - name: Restore previous asset payload
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.clean_rebuild) }}
        run: |
          bash scripts/restore_data_branch.sh "$DATA_BRANCH" \
            "assets.json:data/assets.json" \
            "assets-seed.js:data/assets-seed.js" \
            "asset-coverage.json:data/asset-coverage.json"
      - run: python scripts/update_assets.py
      - name: Validate assets and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assets=json.loads(Path("data/assets.json").read_text(encoding="utf-8"))
          coverage=json.loads(Path("data/asset-coverage.json").read_text(encoding="utf-8"))
          stocks=[row for row in assets.get("assets",[]) if row.get("market")=="TW" and row.get("asset_class")=="stock"]
          assert len(stocks)>=1000, f"stock master too small: {len(stocks)}"
          assert coverage.get("summary",{}).get("total_stocks")==len(stocks), coverage.get("summary")
          print("stocks",len(stocks))
          print("coverage",coverage.get("summary"))
          PY
      - name: Publish isolated asset channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish_data_branch.sh "$DATA_BRANCH" "assets-financials" \
            data/assets.json data/assets-seed.js data/asset-coverage.json
