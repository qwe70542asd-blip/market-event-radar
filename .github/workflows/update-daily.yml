name: Update v11.3.0 assets and audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "data/**"
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-assets
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_assets.py
      - run: python scripts/audit_all_assets.py
      - name: Publish data channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-assets live-assets data/assets.json data/assets-seed.js data/asset-audit.json data/asset-audit-seed.js data/asset-coverage.json data/asset-audit-failures.csv data/asset-update-status.json
