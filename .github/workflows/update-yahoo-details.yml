name: Update v11.4.29 Yahoo detail references
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-yahoo-details.yml"
      - "scripts/update_yahoo_details.py"
      - "scripts/common.py"
      - "requirements.txt"
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-yahoo-details
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore official asset master
        run: bash scripts/restore_data_branch.sh live-assets "assets.json:data/assets.json"
      - name: Restore previous Yahoo detail references
        run: |
          bash scripts/restore_data_branch.sh live-yahoo-details             "yahoo-details.json:data/yahoo-details.json"             "yahoo-details-seed.js:data/yahoo-details-seed.js"
      - run: python scripts/update_yahoo_details.py
      - name: Publish Yahoo detail channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-yahoo-details live-yahoo-details data/yahoo-details.json data/yahoo-details-seed.js
