name: Diagnose TPEx live schemas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/diagnose_tpex_live.py
      - .github/workflows/diagnose-tpex-live.yml
      - docs/V11.4.53-tpex-live-diagnostic.md

permissions:
  contents: read

concurrency:
  group: diagnose-tpex-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture TPEx live HTTP, schema, date and parser diagnostics
        run: |
          mkdir -p artifacts
          python scripts/diagnose_tpex_live.py --output artifacts/tpex-live-diagnostic.json | tee artifacts/tpex-live-diagnostic.log

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpex-live-diagnostic-${{ github.run_id }}
          path: |
            artifacts/tpex-live-diagnostic.json
            artifacts/tpex-live-diagnostic.log
          if-no-files-found: error
          retention-days: 7
