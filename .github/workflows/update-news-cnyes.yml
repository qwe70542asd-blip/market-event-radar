name: Update v11.4.11 鉅亨網 news
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-news-cnyes.yml"
      - "scripts/update_media_source.py"
      - "scripts/news_pipeline.py"
      - "data/news-channels.json"
  schedule:
    - cron: "6-59/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-news-cnyes
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore 鉅亨網 archive and stock master
        run: |
          bash scripts/restore_data_branch.sh live-news-cnyes \
            "news-cnyes.json:data/news-cnyes.json" \
            "news-cnyes-seed.js:data/news-cnyes-seed.js"
          bash scripts/restore_data_branch.sh live-assets \
            "assets.json:data/assets.json"
      - run: python scripts/update_media_source.py --channel cnyes
      - name: Validate isolated source
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          p=json.loads(Path("data/news-cnyes.json").read_text(encoding="utf-8"))
          print("鉅亨網",len(p.get("items",[])),p.get("metadata",{}).get("status"))
          PY2
      - name: Publish isolated channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-news-cnyes cnyes data/news-cnyes.json data/news-cnyes-seed.js
