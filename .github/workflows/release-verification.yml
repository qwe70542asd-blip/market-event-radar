name: Verify v11.4.41 stable app release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-v11-4-41-main
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pyyaml playwright

      - name: Reject nested repository copies
        run: python scripts/cleanup_repo.py --check

      - name: Python, JavaScript and shell syntax
        run: |
          python -m compileall -q scripts tests
          for file in assets/*.js edge/*.js service-worker.js; do node --check "$file"; done
          for file in scripts/*.sh; do bash -n "$file"; done

      - name: Release hygiene
        run: |
          if find . -type f \( -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.wav' \) -print -quit | grep -q .; then
            echo 'audio file must not be bundled in release' >&2
            exit 2
          fi
          if find . -type f \( -iname '*.tmp' -o -iname '*~' -o -iname '*.bak' \) -print -quit | grep -q .; then
            echo 'temporary/editor backup file must not be bundled in release' >&2
            exit 2
          fi

      - name: Workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files=list(Path('.github/workflows').glob('*.yml'))
          for path in files:
              yaml.safe_load(path.read_text(encoding='utf-8'))
          print('workflow yaml',len(files))
          PY

      # Deterministic product checks always run before any external live-source
      # contract check.  A transient TPEx outage can no longer hide app/test
      # regressions by causing all later steps to be skipped.
      - name: Strict data validation
        run: python scripts/validate_public_data.py all

      - name: Automated tests
        run: python -m pytest -q

      - name: HTTP app-shell integration
        run: |
          python -m http.server 8765 > /tmp/market-radar-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 0.25; done
          python scripts/http_smoke.py http://127.0.0.1:8765

      - name: Chromium homepage runtime
        run: |
          python -m playwright install --with-deps chromium
          python -m http.server 8765 > /tmp/market-radar-browser.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 0.25; done
          python scripts/browser_smoke.py http://127.0.0.1:8765

      - name: TPEx v11.4.41 reachability-aware live contract gate
        run: python scripts/verify_v11_4_41_live_sources.py
