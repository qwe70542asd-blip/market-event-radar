name: Update v11.4.26 Taiwan market
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "data/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-tw-market
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore market volume history
        run: |
          bash scripts/restore_data_branch.sh live-tw-market \
            "tw-market.json:data/tw-market.json" \
            "tw-market-seed.js:data/tw-market-seed.js" \
            "market-volume-history.json:data/market-volume-history.json" \
            "market-volume-history-seed.js:data/market-volume-history-seed.js"
      - run: python scripts/update_tw_market.py
      - name: Validate online turnover archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          market=json.loads(Path("data/tw-market.json").read_text(encoding="utf-8"))
          history=json.loads(Path("data/market-volume-history.json").read_text(encoding="utf-8"))
          assert market.get("metadata",{}).get("version")=="v11.4.26"
          assert history.get("metadata",{}).get("history_start")=="2026-01-01"
          assert all(str(row.get("date", "")) >= "2026-01-01" for row in history.get("items",[]))
          print("turnover sessions",len(history.get("items",[])))
          print("20-day sessions",market.get("metadata",{}).get("volume_history_sessions"))
          PY
      - name: Publish data channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-tw-market live-tw-market data/tw-market.json data/tw-market-seed.js data/market-volume-history.json data/market-volume-history-seed.js
