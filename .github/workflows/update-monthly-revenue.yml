name: Update v11.4.45 monthly revenue history
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-monthly-revenue.yml"
      - "scripts/update_monthly_revenue.py"
      - "scripts/update_assets.py"
  schedule:
    - cron: "8 1,7,13,19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-monthly-revenue
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore isolated revenue archive and asset list
        run: |
          bash scripts/restore_data_branch.sh live-monthly-revenue \
            "monthly-revenue.json:data/monthly-revenue.json" \
            "monthly-revenue-seed.js:data/monthly-revenue-seed.js" \
            "monthly-revenue-state.json:data/monthly-revenue-state.json"
          bash scripts/restore_data_branch.sh live-assets \
            "assets.json:data/assets.json"
      - run: python scripts/update_monthly_revenue.py
      - name: Validate isolated revenue channel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("data/monthly-revenue.json").read_text(encoding="utf-8"))
          assert payload.get("items"), "monthly revenue has no usable records"
          print(payload.get("metadata",{}))
          PY
      - name: Publish isolated channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish_data_branch.sh live-monthly-revenue monthly-revenue \
            data/monthly-revenue.json \
            data/monthly-revenue-seed.js \
            data/monthly-revenue-state.json
