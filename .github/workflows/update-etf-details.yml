name: Update v11.4.22 ETF detail references
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-etf-details.yml"
      - "scripts/update_etf_details.py"
      - "scripts/common.py"
      - "requirements.txt"
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-etf-details
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore official asset master
        run: bash scripts/restore_data_branch.sh live-assets "assets.json:data/assets.json"
      - name: Restore previous ETF details
        run: |
          bash scripts/restore_data_branch.sh live-etf-details \
            "etf-details.json:data/etf-details.json" \
            "etf-details-seed.js:data/etf-details-seed.js"
      - run: python scripts/update_etf_details.py
      - name: Publish ETF detail channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-etf-details live-etf-details data/etf-details.json data/etf-details-seed.js
