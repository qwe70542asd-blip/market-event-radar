name: Update v11.4.17 company disclosures
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-company-disclosures.yml"
      - "scripts/update_company_disclosures.py"
      - "scripts/news_pipeline.py"
  schedule:
    - cron: "5-59/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-company-disclosures
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore isolated disclosure archive and asset aliases
        run: |
          bash scripts/restore_data_branch.sh live-company-disclosures \
            "company-disclosures.json:data/company-disclosures.json" \
            "company-disclosures-seed.js:data/company-disclosures-seed.js"
          bash scripts/restore_data_branch.sh live-assets \
            "assets.json:data/assets.json"
      - run: python scripts/update_company_disclosures.py
      - name: Validate isolated disclosure channel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/company-disclosures.json").read_text(encoding="utf-8"))
          assert p.get("items"), "company disclosures returned no usable records"
          print("company disclosures",len(p["items"]))
          PY
      - name: Publish isolated channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-company-disclosures company-disclosures data/company-disclosures.json data/company-disclosures-seed.js
