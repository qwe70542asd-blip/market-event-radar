name: Update v11.4.44 secondary quote references
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-secondary-reference.yml"
      - "scripts/update_secondary_reference.py"
      - "scripts/common.py"
      - "requirements.txt"
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-secondary-reference
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore latest official asset master
        run: |
          bash scripts/restore_data_branch.sh live-assets \
            "assets.json:data/assets.json"
      - name: Restore previous secondary references
        run: |
          bash scripts/restore_data_branch.sh live-secondary-reference \
            "secondary-reference.json:data/secondary-reference.json" \
            "secondary-reference-seed.js:data/secondary-reference-seed.js"
      - run: python scripts/update_secondary_reference.py
      - name: Publish secondary reference channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-secondary-reference live-secondary-reference data/secondary-reference.json data/secondary-reference-seed.js
