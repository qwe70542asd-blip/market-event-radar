name: Update v11.4.45 market core
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-market-core.yml"
      - "scripts/update_market_snapshot.py"
      - "scripts/update_market_klines.py"
      - "scripts/update_tw_market.py"
      - "scripts/publish_data_branch.sh"
      - "scripts/restore_data_branch.sh"
      - "scripts/common.py"
      - "requirements.txt"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-market-core
  cancel-in-progress: false
jobs:
  global-market:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore last successful global snapshot
        run: |
          bash scripts/restore_data_branch.sh live-global-market \
            "market-snapshot.json:data/market-snapshot.json" \
            "market-snapshot-seed.js:data/market-snapshot-seed.js" \
            "market-kline.json:data/market-kline.json" \
            "market-kline-seed.js:data/market-kline-seed.js"
      - run: python scripts/update_market_snapshot.py
      - run: python scripts/update_market_klines.py
      - name: Validate six index channels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot=json.loads(Path("data/market-snapshot.json").read_text(encoding="utf-8"))
          kline=json.loads(Path("data/market-kline.json").read_text(encoding="utf-8"))
          wanted={"^TWII","^DJI","^IXIC","^SOX","^GSPC","^N225"}
          rows={row.get("symbol"):row for row in snapshot.get("items",[]) if row.get("symbol") in wanted}
          assert set(rows)==wanted, set(rows)
          assert wanted <= set((kline.get("items") or {}).keys()), set((kline.get("items") or {}).keys())
          print("snapshot",snapshot.get("metadata",{}).get("updated_at"))
          print("kline",kline.get("metadata",{}).get("updated_at"))
          PY
      - run: python scripts/validate_public_data.py market
      - name: Publish global snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-global-market live-global-market data/market-snapshot.json data/market-snapshot-seed.js data/market-kline.json data/market-kline-seed.js

  taiwan-market:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore asset master and market volume history
        run: |
          bash scripts/restore_data_branch.sh live-assets "assets.json:data/assets.json"
          bash scripts/restore_data_branch.sh live-tw-market \
            "tw-market.json:data/tw-market.json" \
            "tw-market-seed.js:data/tw-market-seed.js" \
            "market-volume-history.json:data/market-volume-history.json" \
            "market-volume-history-seed.js:data/market-volume-history-seed.js"
      - run: python scripts/update_tw_market.py
      - name: Validate verified trading date
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          market=json.loads(Path("data/tw-market.json").read_text(encoding="utf-8"))
          history=json.loads(Path("data/market-volume-history.json").read_text(encoding="utf-8"))
          meta=market.get("metadata",{})
          assert meta.get("version")=="v11.4.45", meta.get("version")
          trading_date=meta.get("trading_date")
          assert trading_date, "verified trading date missing"
          assert date.fromisoformat(trading_date).weekday() < 5, trading_date
          assert meta.get("quote_snapshot_complete") is True, meta.get("quote_exchange_counts")
          quote_dates={str(row.get("quote_date") or "") for row in market.get("items",[]) if row.get("quote_date")}
          assert not quote_dates or quote_dates == {trading_date}, quote_dates
          history_dates=[str(row.get("date")) for row in history.get("items",[]) if row.get("date")]
          assert all(date.fromisoformat(day).weekday() < 5 for day in history_dates)
          assert all(date.fromisoformat(day) <= date.today() for day in history_dates)
          history_end=(history.get("metadata") or {}).get("history_end")
          assert history_end == max(history_dates, default=None), (history_end, max(history_dates, default=None))
          print("trading_date",trading_date,"history_end",history_end,"turnover sessions",len(history_dates))
          PY
      - name: Validate Taiwan turnover integrity
        run: python scripts/validate_public_data.py market
      - name: Publish Taiwan market
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-tw-market live-tw-market data/tw-market.json data/tw-market-seed.js data/market-volume-history.json data/market-volume-history-seed.js
