name: Update v10.5.0 institutional analytics

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_institutional_history.py"
      - "data/institutional-history.json"
      - "data/institutional-history-seed.js"
      - "requirements.txt"
      - ".github/workflows/update-institutional-history.yml"
  schedule:
    # Taiwan time 18:20 and 20:20 on weekdays
    - cron: "20 10,12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-radar-institutional-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update institutional history
        run: python scripts/update_institutional_history.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data/institutional-history.json").read_text(encoding="utf-8"))
          daily=data.get("daily",[])
          assert daily, "institutional history is empty"
          assert all(row.get("date") and row.get("foreign") for row in daily)
          print("history:",len(daily))
          print("latest:",data.get("metadata",{}).get("latest_date"))
          print("ranking date:",data.get("ranking_date"))
          PY

      - name: Commit data
        run: |
          if git diff --quiet -- data/institutional-history.json data/institutional-history-seed.js; then
            echo "No institutional changes."
            exit 0
          fi
          git config user.name "market-event-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/institutional-history.json data/institutional-history-seed.js
          git commit -m "chore: refresh institutional analytics v10.5.0"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 4))
          done
          exit 1
