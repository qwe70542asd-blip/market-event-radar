name: Update v11.4.25 中央社 news
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-news-cna.yml"
      - "scripts/update_media_source.py"
      - "scripts/news_pipeline.py"
      - "data/news-channels.json"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-news-cna
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore 中央社 archive and stock master
        run: |
          bash scripts/restore_data_branch.sh live-news-cna \
            "news-cna.json:data/news-cna.json" \
            "news-cna-seed.js:data/news-cna-seed.js"
          bash scripts/restore_data_branch.sh live-assets \
            "assets.json:data/assets.json"
      - run: python scripts/update_media_source.py --channel cna
        env:
          NEWS_HISTORY_BACKFILL: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: Validate isolated source
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          p=json.loads(Path("data/news-cna.json").read_text(encoding="utf-8"))
          print("中央社",len(p.get("items",[])),p.get("metadata",{}).get("status"))
          PY2
      - run: python scripts/validate_public_data.py news
      - name: Publish isolated channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-news-cna cna data/news-cna.json data/news-cna-seed.js
