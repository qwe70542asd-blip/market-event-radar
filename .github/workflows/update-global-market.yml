name: Update v11.4.28 global market
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "data/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-global-market
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore last successful global snapshot
        run: |
          bash scripts/restore_data_branch.sh live-global-market \
            "market-snapshot.json:data/market-snapshot.json" \
            "market-snapshot-seed.js:data/market-snapshot-seed.js" \
            "market-kline.json:data/market-kline.json" \
            "market-kline-seed.js:data/market-kline-seed.js"
      - run: python scripts/update_market_snapshot.py
      - run: python scripts/update_market_klines.py
      - name: Validate six index K-lines
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("data/market-snapshot.json").read_text(encoding="utf-8"))
          wanted={"^TWII","^DJI","^IXIC","^SOX","^GSPC","^N225"}
          rows={row.get("symbol"):row for row in payload.get("items",[]) if row.get("symbol") in wanted}
          assert set(rows)==wanted, set(rows)
          counts={symbol:len(rows[symbol].get("candles") or []) for symbol in wanted}
          print("K-line sessions",counts)
          assert sum(count>=10 for count in counts.values())>=4, counts
          PY
      - run: python scripts/validate_public_data.py market
      - name: Publish data channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-global-market live-global-market data/market-snapshot.json data/market-snapshot-seed.js data/market-kline.json data/market-kline-seed.js
