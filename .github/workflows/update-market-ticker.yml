name: Update v10.5.1 grouped indices and ETF rails

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_market_snapshot.py"
      - "data/market-snapshot.json"
      - "data/market-snapshot-seed.js"
      - "requirements.txt"
      - ".github/workflows/update-market-ticker.yml"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-radar-market-ticker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update grouped market snapshot
        run: python scripts/update_market_snapshot.py

      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data/market-snapshot.json").read_text(encoding="utf-8"))
          ids={row.get("id") for row in data.get("items",[])}
          assert {"TAIEX","TPEX","SP500","NASDAQ","DJIA","SOX","NIKKEI","KOSPI"}.issubset(ids)
          assert len(data.get("taiwan_etfs",[])) == 15
          assert len(data.get("us_etfs",[])) >= 8
          print("indices",len(data["items"]),"tw_etfs",len(data["taiwan_etfs"]),"us_etfs",len(data["us_etfs"]))
          PY

      - name: Commit market data
        run: |
          if git diff --quiet -- data/market-snapshot.json data/market-snapshot-seed.js; then
            echo "No market changes."
            exit 0
          fi
          git config user.name "market-event-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-snapshot.json data/market-snapshot-seed.js
          git commit -m "chore: refresh grouped indices and ETF rails v10.5.1"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 4))
          done
          exit 1
