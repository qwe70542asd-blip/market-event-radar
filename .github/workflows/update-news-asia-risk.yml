name: Update v11.4.36 亞洲總體風險 news
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-news-asia-risk
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore 亞洲總體風險 archive and stock master
        run: |
          bash scripts/restore_data_branch.sh live-news-asia-risk \
            "news-asia-risk.json:data/news-asia-risk.json" \
            "news-asia-risk-seed.js:data/news-asia-risk-seed.js"
          bash scripts/restore_data_branch.sh live-assets \
            "assets.json:data/assets.json"
          bash scripts/restore_data_branch.sh live-stock-basics \
            "stock-basics.json:data/stock-basics.json"
      - run: python scripts/update_media_source.py --channel asia-risk
        env:
          NEWS_HISTORY_BACKFILL: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: Validate isolated source
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          p=json.loads(Path("data/news-asia-risk.json").read_text(encoding="utf-8"))
          assert isinstance(p.get("items"),list)
          print("亞洲總體風險",len(p.get("items",[])),p.get("metadata",{}).get("status"))
          PY2
      - run: python scripts/validate_public_data.py news
      - name: Publish isolated channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-news-asia-risk asia-risk data/news-asia-risk.json data/news-asia-risk-seed.js
