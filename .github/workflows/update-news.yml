name: Update v11.4.2 finance news
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "data/**"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-news
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore last successful news archive
        run: |
          bash scripts/restore_data_branch.sh live-news \
            "news.json:data/news.json" \
            "news-seed.js:data/news-seed.js"
      - run: python scripts/update_news.py
      - name: Reject empty news publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("data/news.json").read_text(encoding="utf-8"))
          assert payload.get("items"), "news feed is empty; refusing publication"
          print("news items",len(payload["items"]))
          PY
      - name: Publish data channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-news live-news data/news.json data/news-seed.js
