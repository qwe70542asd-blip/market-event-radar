name: Update v11.1.2 multi-source news

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-news.yml"
      - "scripts/update_news.py"
      - "requirements.txt"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-radar-live-data-writer
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIVE_BRANCH: live-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore last successful archive
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$LIVE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$LIVE_BRANCH"
            for file in news.json news-seed.js news-link-cache.json; do
              if git cat-file -e "FETCH_HEAD:$file" 2>/dev/null; then
                git show "FETCH_HEAD:$file" > "data/$file"
              fi
            done
          fi
      - run: python scripts/update_news.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/news.json").read_text(encoding="utf-8"))
          assert p.get("items"), "empty news"
          assert p.get("metadata",{}).get("retention_days")==20
          assert all(str(x.get("link","")).startswith(("http://","https://")) for x in p["items"])
          print("OK",len(p["items"]),"news")
          PY
      - name: Publish news files to live-data
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/market-live && mkdir -p /tmp/market-live
          cd /tmp/market-live
          git init
          git config user.name "market-event-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin "$LIVE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$LIVE_BRANCH"
            git checkout -B "$LIVE_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$LIVE_BRANCH"
          fi
          cp "$GITHUB_WORKSPACE/data/news.json" news.json
          cp "$GITHUB_WORKSPACE/data/news-seed.js" news-seed.js
          cp "$GITHUB_WORKSPACE/data/news-link-cache.json" news-link-cache.json
          git add news.json news-seed.js news-link-cache.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh multi-source news v11.1.2"
          git push origin "HEAD:$LIVE_BRANCH"
