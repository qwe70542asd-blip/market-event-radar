name: Update v10 finance news

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_news.py"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-radar-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh finance news
        run: python scripts/update_news.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/news.json").read_text(encoding="utf-8"))
          assert isinstance(data.get("items"), list)
          print("items:", len(data["items"]))
          print("sources:", len(data.get("sources", [])))
          PY

      - name: Commit changed news
        run: |
          if git diff --quiet -- data/news.json data/news-seed.js; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "market-event-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news-seed.js
          git commit -m "chore: refresh v10 finance news"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          exit 1
