name: Update v11.2.5 multi-source news

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-news.yml"
      - "scripts/update_news.py"
      - "scripts/publish_data_branch.sh"
      - "scripts/restore_data_branch.sh"
      - "requirements.txt"
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      clean_rebuild:
        description: "Ignore the previous live-news archive and rebuild from current sources"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: market-radar-news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      DATA_BRANCH: live-news
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore previous news archive
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.clean_rebuild) }}
        run: |
          bash scripts/restore_data_branch.sh "$DATA_BRANCH" \
            "news.json:data/news.json" \
            "news-seed.js:data/news-seed.js" \
            "news-link-cache.json:data/news-link-cache.json"
      - name: Reset news archive for clean rebuild
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_rebuild }}
        run: |
          cat > data/news.json <<'JSON'
          {"metadata":{"version":"v11.2.5"},"items":[],"sources":[]}
          JSON
          printf '{}\n' > data/news-link-cache.json
      - run: python scripts/update_news.py
      - name: Validate news
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("data/news.json").read_text(encoding="utf-8"))
          assert payload.get("items"), "empty news archive"
          assert payload.get("metadata",{}).get("retention_days")==20
          assert all(str(row.get("link","")).startswith(("http://","https://")) for row in payload["items"])
          print("news",len(payload["items"]))
          print("updated",payload.get("metadata",{}).get("updated_at"))
          PY
      - name: Publish isolated news channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish_data_branch.sh "$DATA_BRANCH" "multi-source-news" \
            data/news.json data/news-seed.js data/news-link-cache.json
