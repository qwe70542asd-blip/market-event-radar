name: Update related news

on:
  schedule:
    # Every 4 hours, offset from the top of the hour to reduce GitHub queue delays.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-radar-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh related coverage
        env:
          NEWS_MAX_EVENTS: "12"
        run: python scripts/update_news.py

      - name: Commit changed news
        run: |
          if git diff --quiet -- data/news.json data/news-seed.js; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "market-event-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news-seed.js
          git commit -m "chore: update related market coverage"
          git pull --rebase
          git push
