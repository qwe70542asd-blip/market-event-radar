name: Update multi-source finance news

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_news.py"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"
  schedule:
    # GitHub Actions cron cannot reliably update every minute.
    # Refresh source data every 15 minutes; the website rotates headlines every 60 seconds.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-radar-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh multi-source finance coverage
        env:
          NEWS_MAX_EVENTS: "12"
        run: python scripts/update_news.py

      - name: Commit changed news
        run: |
          if git diff --quiet -- data/news.json data/news-seed.js; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "market-event-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news-seed.js
          git commit -m "chore: update related market coverage"
          git pull --rebase
          git push
