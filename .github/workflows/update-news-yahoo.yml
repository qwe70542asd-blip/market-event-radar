name: Update v11.4.33 Yahoo股市 news
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-news-yahoo
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore Yahoo股市 archive and stock master
        run: |
          bash scripts/restore_data_branch.sh live-news-yahoo \
            "news-yahoo.json:data/news-yahoo.json" \
            "news-yahoo-seed.js:data/news-yahoo-seed.js"
          bash scripts/restore_data_branch.sh live-assets \
            "assets.json:data/assets.json"
          bash scripts/restore_data_branch.sh live-stock-basics \
            "stock-basics.json:data/stock-basics.json"
      - run: python scripts/update_media_source.py --channel yahoo
        env:
          NEWS_HISTORY_BACKFILL: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: Validate isolated source
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          p=json.loads(Path("data/news-yahoo.json").read_text(encoding="utf-8"))
          print("Yahoo股市",len(p.get("items",[])),p.get("metadata",{}).get("status"))
          PY2
      - run: python scripts/validate_public_data.py news
      - name: Publish isolated channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data_branch.sh live-news-yahoo yahoo data/news-yahoo.json data/news-yahoo-seed.js
