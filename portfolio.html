<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07111f" />
  <title>我的投資組合｜全球市場即時雷達</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/styles.css?v=10.0.0" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><svg viewBox="0 0 48 48"><path d="M7 34 16 24l7 6 10-16 8 6"/><path d="M7 40h34"/></svg></span>
      <span><strong>我的投資組合 <em class="version-badge">v10.0</em></strong><small>PERSONALIZED MARKET FEED</small></span>
    </a>
    <div class="top-actions">
      <a class="mini-btn nav-link" href="index.html">事件首頁</a>
      <a class="mini-btn nav-link" href="news.html">全部新聞</a>
    </div>
  </header>

  <main class="shell portfolio-page-shell">
    <section class="portfolio-page-hero">
      <div>
        <p class="eyebrow">MY ASSETS</p>
        <h1>讓首頁以你的持股為主</h1>
        <p>股票、ETF 與基金會使用不同的關聯方式。基金會依投資區域、產業、利率與匯率主題配對新聞。</p>
      </div>
      <div id="portfolioPageStats" class="portfolio-page-stats"></div>
    </section>

    <section class="portfolio-page-layout">
      <aside class="portfolio-manager-card">
        <div class="section-heading section-heading-tight">
          <div><p class="eyebrow">ADD ASSET</p><h2>加入標的</h2></div>
        </div>
        <form id="portfolioPageAddForm" class="portfolio-add-form portfolio-add-form-page">
          <select name="type"><option value="stock">股票</option><option value="etf">ETF</option><option value="fund">基金</option></select>
          <select name="market"><option value="TW">台灣</option><option value="US">美國</option><option value="JP">日本</option><option value="KR">韓國</option><option value="GLOBAL">全球／基金</option></select>
          <input name="symbol" placeholder="代碼（基金可不填）" />
          <input name="name" placeholder="股票、ETF 或基金名稱" />
          <label class="fund-theme-field" hidden><span>基金主要主題</span>
            <select name="theme">
              <option value="global-equity">全球股票</option><option value="us-tech">美國科技</option>
              <option value="tw-equity">台灣股票</option><option value="jp-equity">日本股票</option>
              <option value="kr-equity">韓國股票</option><option value="bond">投資級債券</option>
              <option value="high-yield">高收益債</option><option value="emerging">新興市場</option>
              <option value="energy">能源</option><option value="gold">黃金</option>
            </select>
          </label>
          <button type="submit">加入投資組合</button>
          <span class="portfolio-form-status"></span>
        </form>
        <div id="portfolioPageEntries" class="portfolio-entry-list"></div>
      </aside>

      <section class="portfolio-feed-card">
        <div class="section-heading section-heading-tight">
          <div><p class="eyebrow">PERSONAL NEWS</p><h2>與你的投資相關</h2></div>
          <span>依名稱、代碼、區域與基金主題排序</span>
        </div>
        <div id="portfolioPageNews" class="portfolio-page-news-grid"></div>
      </section>
    </section>
  </main>

  <nav class="mobile-bottom-nav">
    <a href="index.html"><span>⌂</span><b>首頁</b></a>
    <a href="index.html#calendarSection"><span>▦</span><b>日曆</b></a>
    <a href="news.html"><span>▤</span><b>快訊</b></a>
    <a class="active" href="portfolio.html"><span>★</span><b>投資組合</b></a>
  </nav>

  <script src="data/seed.js"></script>
  <script src="data/news-seed.js"></script>
  <script src="assets/news-core.js?v=10.0.0" defer></script>
  <script src="assets/portfolio.js?v=10.0.0" defer></script>
  <script src="assets/sw-register.js?v=10.0.0" defer></script>
</body>
</html>
